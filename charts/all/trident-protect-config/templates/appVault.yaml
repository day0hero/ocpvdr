{{- if .Values.tridentProtect.appVault.enabled }}
apiVersion: protect.trident.netapp.io/v1
kind: AppVault
metadata:
  name: {{ .Values.tridentProtect.appVault.name }}
  namespace: trident-protect
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  providerType: {{ .Values.tridentProtect.appVault.providerType }}
  providerConfig:
{{- with .Values.tridentProtect.appVault.s3 }}
  {{- if eq $.Values.tridentProtect.appVault.providerType "AWS" }}
    aws:
      bucketName: {{ .bucketName | quote }}
      region: {{ .region | quote }}
  {{- else }}
    s3:
      {{- if .endpoint }}
      endpoint: {{ .endpoint | quote }}
      {{- end }}
      bucketName: {{ .bucketName | quote }}
      {{- if .region }}
      region: {{ .region | quote }}
      {{- end }}
      {{- if hasKey . "secure" }}
      secure: {{ .secure }}
      {{- end }}
      {{- if hasKey . "skipCertValidation" }}
      skipCertValidation: {{ .skipCertValidation }}
      {{- end }}
  {{- end }}
{{- end }}
  providerCredentials:
    accessKeyID:
      valueFromSecret:
        key: accessKeyID
        name: {{ .Values.tridentProtect.appVault.credentials.secretName }}
    secretAccessKey:
      valueFromSecret:
        key: secretAccessKey
        name: {{ .Values.tridentProtect.appVault.credentials.secretName }}
{{- end }}
