# Default values for trident-protect-config
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# ExternalSecret Configuration
secretStoreRef:
  name: vault-backend
  kind: ClusterSecretStore

# Trident Protect AppVault configuration
tridentProtect:
  # AppVault for S3-compatible storage (FSx ONTAP S3 or AWS S3)
  appVault:
    enabled: true
    name: ontap-s3-appvault
    # Type: AWS, Azure, GCP, S3, ONTAP-S3, StorageGRID-S3, Generic-S3
    providerType: ONTAP-S3
    # Credentials from Vault
    credentials:
      key: secret/data/global/trident-protect-s3
      secretName: trident-protect-s3-creds
    # S3 configuration
    s3:
      endpoint: ""  # e.g., https://svm-xxx.fs-xxx.fsx.us-west-1.amazonaws.com
      bucketName: ""  # e.g., trident-protect-bucket
      region: us-west-1
      secure: true
      skipCertValidation: false
