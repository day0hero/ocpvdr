---
# Ansible playbook to create FSx ONTAP using Terraform
# This playbook wraps Terraform execution with network discovery from the cluster
#
# Usage:
#   make build-fsx-terraform                           # Use local Terraform state
#   make build-fsx-terraform TERRAFORM_STATE_BUCKET=my-bucket  # Use S3 backend
#   make destroy-fsx-terraform                         # Destroy resources

- name: Create AWS FSx for ONTAP using Terraform
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/fsx-ontap-vars.yml"
  tasks:
    - name: Skip creation if deletion is requested
      meta: end_play
      when: terraform_destroy | default(false)

    - name: Get cluster infrastructure info
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Infrastructure
        name: cluster
      register: infrastructure_info
      failed_when: false

    - name: Set cluster_name from infrastructure if not provided
      set_fact:
        cluster_name: "{{ infrastructure_info.resources[0].status.infrastructureName }}"
      when:
        - infrastructure_info.resources is defined
        - infrastructure_info.resources | length > 0
        - infrastructure_info.resources[0].status.infrastructureName is defined
        - cluster_name is not defined or cluster_name == ''

    - name: Fail if cluster_name cannot be determined
      fail:
        msg: "cluster_name could not be determined from cluster infrastructure. Pass it via -e cluster_name=<name>"
      when: cluster_name is not defined or cluster_name == ''

    - name: Set is_hcp_cluster fact from infrastructure
      set_fact:
        is_hcp_cluster: "{{ infrastructure_info.resources[0].status.controlPlaneTopology | default('') == 'External' if (infrastructure_info.resources is defined and infrastructure_info.resources | length > 0) else false }}"

    - name: Set vpc_name fact from cluster_name (standard cluster)
      set_fact:
        vpc_name: "{{ cluster_name }}-vpc"
      when: 
        - cluster_name is defined
        - not (is_hcp_cluster | default(false) | bool)

    - name: Set vpc_name fact from cluster_name (HCP cluster)
      set_fact:
        vpc_name: "{{ cluster_name }}-vpc"
      when: 
        - cluster_name is defined
        - is_hcp_cluster | default(false) | bool

    - name: Debug network configuration
      debug:
        msg:
          - "Network Configuration:"
          - "  cluster_name: {{ cluster_name | default('not set') }}"
          - "  aws_region: {{ aws_region | default('not set') }}"
          - "  is_hcp_cluster: {{ is_hcp_cluster | default('not set') }}"
          - "  vpc_name: {{ vpc_name | default('not set') }}"
          - "  terraform_state_bucket: {{ terraform_state_bucket | default('local state') }}"

    # VPC Lookup
    - name: Look up VPC by name (standard cluster)
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ vpc_name }}"
      register: vpc_lookup
      when: 
        - vpc_name is defined and vpc_name != ""
        - not (is_hcp_cluster | default(false) | bool)

    - name: Look up VPC by name (HCP cluster - primary)
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ vpc_name }}"
      register: vpc_lookup_hcp_name
      when: 
        - vpc_name is defined and vpc_name != ""
        - is_hcp_cluster | default(false) | bool

    - name: Look up VPC by cluster tag (HCP cluster - fallback)
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          "tag:sigs.k8s.io/cluster-api-provider-aws/cluster/{{ cluster_name }}": owned
      register: vpc_lookup_hcp_tag
      when: 
        - vpc_name is defined and vpc_name != ""
        - is_hcp_cluster | default(false) | bool
        - vpc_lookup_hcp_name.vpcs | default([]) | length == 0

    - name: Set VPC lookup result for HCP cluster
      set_fact:
        vpc_lookup:
          vpcs: "{{ vpc_lookup_hcp_tag.vpcs if (vpc_lookup_hcp_tag.vpcs | default([]) | length > 0) else vpc_lookup_hcp_name.vpcs }}"
      when: 
        - is_hcp_cluster | default(false) | bool
        - vpc_lookup_hcp_name is defined

    - name: Get VPC ID from lookup
      set_fact:
        vpc_id: "{{ vpc_lookup.vpcs[0].vpc_id if (vpc_lookup.vpcs | default([]) | length > 0) else '' }}"
      when: vpc_lookup is defined

    - name: Fail if VPC not found
      fail:
        msg: "VPC not found. Check cluster_name ({{ cluster_name }}) and aws_region ({{ aws_region }})"
      when: vpc_id | default('') == ''

    # Subnet Lookup
    - name: Build subnet tag filters (non-HCP)
      set_fact:
        subnet_tag_filters: "{{ tag_filters_list | items2dict }}"
      vars:
        tag_filters_list:
          - key: "vpc-id"
            value: "{{ vpc_id }}"
          - key: "tag:sigs.k8s.io/cluster-api-provider-aws/role"
            value: "private"
          - key: "tag:kubernetes.io/cluster/{{ cluster_name }}"
            value: "owned"
          - key: "tag:sigs.k8s.io/cluster-api-provider-aws/cluster/{{ cluster_name }}"
            value: "owned"
      when:
        - vpc_id is defined and vpc_id != ""
        - not (is_hcp_cluster | default(false) | bool)

    - name: Build subnet tag filters (HCP)
      set_fact:
        subnet_tag_filters: "{{ tag_filters_list | items2dict }}"
      vars:
        tag_filters_list:
          - key: "vpc-id"
            value: "{{ vpc_id }}"
          - key: "tag:kubernetes.io/role/internal-elb"
            value: "1"
      when:
        - vpc_id is defined and vpc_id != ""
        - is_hcp_cluster | default(false) | bool

    - name: Look up subnets by tags
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters: "{{ subnet_tag_filters }}"
      register: subnet_lookup
      when: vpc_id is defined and vpc_id != ""

    - name: Set subnet IDs
      set_fact:
        subnet_ids: "{{ subnet_lookup.subnets | map(attribute='id') | list }}"
      when:
        - subnet_lookup.subnets is defined
        - subnet_lookup.subnets | length >= 2

    - name: Fail if not enough subnets found
      fail:
        msg: "Need at least 2 subnets for MULTI_AZ deployment, found {{ subnet_lookup.subnets | default([]) | length }}"
      when: subnet_ids | default([]) | length < 2

    # Route Table Lookup
    - name: Look up route tables for subnets
      amazon.aws.ec2_vpc_route_table_info:
        region: "{{ aws_region }}"
        filters:
          "association.subnet-id": "{{ subnet_ids }}"
          vpc-id: "{{ vpc_id }}"
      register: route_table_lookup
      when: subnet_ids is defined

    - name: Set route table IDs
      set_fact:
        route_table_ids: "{{ route_table_lookup.route_tables | map(attribute='id') | list | unique }}"
      when: route_table_lookup.route_tables is defined

    - name: Display discovered network configuration
      debug:
        msg:
          - "Discovered Network Configuration:"
          - "  VPC ID: {{ vpc_id }}"
          - "  Subnet IDs: {{ subnet_ids }}"
          - "  Route Table IDs: {{ route_table_ids }}"

    # Password handling
    - name: Check if ~/.fsx file exists
      stat:
        path: "{{ '~/.fsx' | expanduser }}"
      register: fsx_file_stat

    - name: Read password from ~/.fsx file
      slurp:
        src: "{{ '~/.fsx' | expanduser }}"
      register: fsx_file_content
      when: fsx_file_stat.stat.exists | default(false)
      failed_when: false

    - name: Extract password from ~/.fsx file
      set_fact:
        fsx_password_from_file: "{{ fsx_file_content.content | b64decode | string | trim }}"
      when:
        - fsx_file_stat.stat.exists | default(false)
        - fsx_file_content is defined
        - fsx_file_content.content is defined

    - name: Override passwords from ~/.fsx file
      set_fact:
        fsx_admin_password: "{{ fsx_password_from_file }}"
        svm_admin_password: "{{ fsx_password_from_file }}"
      when:
        - fsx_file_stat.stat.exists | default(false)
        - fsx_password_from_file is defined
        - fsx_password_from_file | length > 0

    - name: Validate fsx_admin_password is set
      fail:
        msg: |
          fsx_admin_password is required but not found.
          Please either:
          1. Create ~/.fsx file with the password, OR
          2. Pass it via -e fsx_admin_password=<password> on the command line.
      when: fsx_admin_password is not defined or fsx_admin_password == '' or fsx_admin_password == 'null'

    - name: Set file_system_name from cluster_name if not provided
      set_fact:
        file_system_name: "{{ cluster_name }}-fsx-ontap"
      when: (file_system_name is not defined) or (file_system_name | default('') | trim | length == 0)

    - name: Display FSx configuration
      debug:
        msg:
          - "FSx Configuration:"
          - "  File System Name: {{ file_system_name }}"
          - "  Cluster Name: {{ cluster_name }}"

    # Ensure file_system_name is set before calling role
    - name: Compute file_system_name for role
      set_fact:
        computed_file_system_name: "{{ file_system_name if (file_system_name | default('') | trim | length > 0) else cluster_name + '-fsx-ontap' }}"

    - name: Debug computed file_system_name
      debug:
        msg: "Computed file_system_name: '{{ computed_file_system_name }}'"

    # Run Terraform
    - name: Run FSx ONTAP Terraform role
      include_role:
        name: fsx_ontap_terraform
      vars:
        cluster_name: "{{ cluster_name }}"
        file_system_name: "{{ computed_file_system_name }}"

# Destroy playbook
- name: Destroy FSx ONTAP using Terraform
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/fsx-ontap-vars.yml"
  tasks:
    - name: Skip destroy play if not requested
      meta: end_play
      when: not (terraform_destroy | default(false))

    - name: Run FSx ONTAP Terraform role (destroy)
      include_role:
        name: fsx_ontap_terraform
      vars:
        terraform_destroy: true
