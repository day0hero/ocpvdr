---
# Defaults for fsx_ontap_terraform role

# Terraform Configuration
terraform_dir: "{{ playbook_dir }}/../terraform/fsx-ontap"
terraform_state_bucket: ""
# The region where the S3 state bucket is located (NOT the deployment region)
# This must match where your state bucket was created
terraform_state_bucket_region: ""
# State key will be auto-generated as fsx-ontap/<cluster_name>/<aws_region>/terraform.tfstate if not set
terraform_state_key: ""
terraform_state_dynamodb_table: "terraform-state-lock"

# Container Configuration
use_container: true
container_runtime: "podman"  # podman or docker
terraform_image: "localhost/terraform-ubi-minimal:1.14.3"

# Network Configuration (will be auto-detected from cluster if not provided)
vpc_id: ""
subnet_ids: []
route_table_ids: []
allowed_cidr: "10.0.0.0/16"

# FSx ONTAP Configuration
# file_system_name is derived from cluster_name if not set
# (do not set a default here - let the playbook compute it from cluster_name)
storage_capacity: 1024
throughput_capacity: 1024
storage_type: "SSD"
deployment_type: "MULTI_AZ_1"
weekly_maintenance_time: "7:01:00"
automatic_backup_retention_days: 3
daily_automatic_backup_start_time: "01:00"

# SVM Configuration
svm_name: "SVM1"
root_volume_security_style: "UNIX"

# Secrets Manager
create_secrets: true

# Tags
tags:
  Environment: "production"
  ManagedBy: "Terraform"

# Operation mode
terraform_destroy: false

# Update values-trident.yaml with SVM info
update_trident_values: true
